<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      /* Classic script (ne module): teče pred Vite modern-detect.
         LG webOS ~Chrome 79 sicer gre v “modern” bundle, kjer manjkajo polyfilli
         (npr. .at / randomUUID) → bela stran. Prisili legacy SystemJS paket. */
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var q = String(location.search || "");
          var forceLegacy =
            /(?:\?|&)legacy=1(?:&|$)/.test(q) ||
            /Web0S|WebOS|NetCast|LG Browser|Tizen|SmartTV|SMART-TV|SamsungBrowser|Viera|CrKey|AppleTV|BRAVIA|HbbTV|TV Safari/i.test(
              ua,
            );
          if (!forceLegacy) return;
          window.__BOLING_FORCE_LEGACY__ = true;
          Object.defineProperty(window, "__vite_is_modern_browser", {
            configurable: true,
            get: function () {
              return false;
            },
            set: function () {
              /* Vite hoče nastaviti true — ignoriraj. */
            },
          });
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <script>
      document.documentElement.dataset.theme = "dark";
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("device");
          if (q === "phone" || q === "tablet" || q === "desktop" || q === "tv") {
            document.documentElement.dataset.device = q;
            return;
          }
          var ua = navigator.userAgent || "";
          if (/Tizen|SmartTV|SMART-TV|SamsungBrowser|Web0S|WebOS|Viera|NetCast|CrKey|AppleTV|BRAVIA|HbbTV|TV Safari/i.test(ua)) {
            document.documentElement.dataset.device = "tv";
            return;
          }
          var w = window.innerWidth || 0;
          document.documentElement.dataset.device =
            w <= 820 ? "phone" : w <= 1200 ? "tablet" : "desktop";
        } catch (e) {
          document.documentElement.dataset.device = "desktop";
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Liga - Bowling Lenart</title>
    <link rel="icon" href="/logo-bowling-lenart.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <style>
      /* Če JS ne naloži (star TV), naj ne bo bela prazna stran. */
      html, body { margin: 0; min-height: 100%; background: #0c0b0b; color: #f4f2ef; }
      #boot-msg {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        font-family: system-ui, sans-serif;
        text-align: center;
        gap: 8px;
        padding: 24px;
      }
      #boot-msg small { color: #9a9690; }
    </style>
    <div id="root">
      <p id="boot-msg">Nalaganje…<br /><small>Bowling Lenart Liga</small></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var lastErr = "";
        function showFail(extra) {
          var el = document.getElementById("boot-msg");
          if (!el || !document.body || document.body.dataset.appReady === "1") return;
          el.innerHTML =
            "Prikaz se ni naložil.<br/><small>Na starem TV odpri:<br/>/?display=live&amp;device=tv&amp;legacy=1</small>" +
            (extra
              ? "<br/><small style='opacity:.7;word-break:break-word'>" + extra + "</small>"
              : "");
        }
        window.addEventListener("error", function (e) {
          lastErr = (e && e.message) || "script error";
          if (e && e.filename) lastErr += " @ " + String(e.filename).split("/").pop();
        });
        window.addEventListener("unhandledrejection", function (e) {
          lastErr =
            (e && e.reason && (e.reason.message || String(e.reason))) || "promise error";
        });
        setTimeout(function () {
          if (document.body && document.body.dataset.appReady === "1") return;
          showFail(lastErr || "timeout · " + (navigator.userAgent || "").slice(0, 90));
        }, 12000);
      })();
    </script>
  </body>
</html>
